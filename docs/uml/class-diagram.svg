  <rect class="pkg" x="25" y="210" width="475" height="950" rx="10"/><text class="pkglabel" x="45" y="240">api</text>
  <g transform="translate(60 270)"><rect class="box" width="405" height="92" rx="5"/><rect class="head" width="405" height="42" rx="5"/><text class="name" x="202" y="27" text-anchor="middle">RestApplication</text><line x1="0" y1="42" x2="405" y2="42" stroke="#173f31"/><text class="txt" x="14" y="70">@ApplicationPath("/api")</text></g>
  <g transform="translate(60 410)"><rect class="box" width="405" height="112" rx="5"/><rect class="head" width="405" height="42" rx="5"/><text class="name" x="202" y="27" text-anchor="middle">HealthResource</text><line x1="0" y1="42" x2="405" y2="42" stroke="#173f31"/><text class="txt" x="14" y="68">@GET @Path("/health")</text><text class="txt" x="14" y="94">+ health(): Map&lt;String, String&gt;</text></g>
  <g transform="translate(60 575)"><rect class="box" width="405" height="176" rx="5"/><rect class="head" width="405" height="42" rx="5"/><text class="name" x="202" y="27" text-anchor="middle">TranslatorResource</text><line x1="0" y1="42" x2="405" y2="42" stroke="#173f31"/><text class="txt" x="14" y="68">@POST @Path("/translate")</text><text class="txt" x="14" y="94">+ translate(request): Response</text><text class="txt" x="14" y="120">- providerError(exception): Response</text><text class="txt" x="14" y="146">- configuredModel(): String</text></g>
  <g transform="translate(60 835)"><rect class="box" width="405" height="252" rx="5"/><rect class="head" width="405" height="42" rx="5"/><text class="name" x="202" y="27" text-anchor="middle">TranslationRequest</text><line x1="0" y1="42" x2="405" y2="42" stroke="#173f31"/><text class="txt" x="14" y="68">- text: String</text><text class="txt" x="14" y="94">- sourceLanguage: String</text><line x1="0" y1="108" x2="405" y2="108" stroke="#173f31"/><text class="txt" x="14" y="134">+ TranslationRequest()</text><text class="txt" x="14" y="160">+ getText(): String</text><text class="txt" x="14" y="186">+ setText(text): void</text><text class="txt" x="14" y="212">+ getSourceLanguage(): String</text><text class="txt" x="14" y="238">+ setSourceLanguage(value): void</text></g>

  <rect class="pkg" x="530" y="210" width="625" height="950" rx="10"/><text class="pkglabel" x="550" y="240">translation</text>
  <g transform="translate(565 270)"><rect class="box" width="555" height="244" rx="5"/><rect class="head" width="555" height="42" rx="5"/><text class="name" x="277" y="27" text-anchor="middle">GeminiTranslationClient</text><line x1="0" y1="42" x2="555" y2="42" stroke="#173f31"/><text class="txt" x="14" y="68">- httpClient: HttpClient</text><text class="txt" x="14" y="94">- configuration: ProviderConfiguration</text><line x1="0" y1="108" x2="555" y2="108" stroke="#173f31"/><text class="txt" x="14" y="134">+ GeminiTranslationClient()</text><text class="txt" x="14" y="160">~ GeminiTranslationClient(httpClient, configuration)</text><text class="txt" x="14" y="186">+ translate(text, sourceLanguage): String</text><text class="txt" x="14" y="212">- loadConfiguration() / buildRequestBody() / extractTranslation()</text></g>
  <g transform="translate(565 570)"><rect class="box" width="555" height="218" rx="5"/><rect class="head" width="555" height="58" rx="5"/><text class="st" x="277" y="20" text-anchor="middle">«record»</text><text class="name" x="277" y="44" text-anchor="middle">ProviderConfiguration</text><line x1="0" y1="58" x2="555" y2="58" stroke="#173f31"/><text class="txt" x="14" y="84">+ apiBaseUri: URI</text><text class="txt" x="14" y="110">+ model: String</text><text class="txt" x="14" y="136">- apiKey: String</text><text class="txt" x="285" y="84">+ timeout: Duration</text><line x1="0" y1="150" x2="555" y2="150" stroke="#173f31"/><text class="txt" x="14" y="176">+ fromEnvironment(): ProviderConfiguration</text><text class="txt" x="14" y="202">~ generateContentUri(): URI</text></g>
  <g transform="translate(565 850)"><rect class="box" width="390" height="218" rx="5"/><rect class="head" width="390" height="42" rx="5"/><text class="name" x="195" y="27" text-anchor="middle">TranslationProviderException</text><line x1="0" y1="42" x2="390" y2="42" stroke="#173f31"/><text class="txt" x="14" y="68">- kind: Kind</text><line x1="0" y1="82" x2="390" y2="82" stroke="#173f31"/><text class="txt" x="14" y="108">+ TranslationProviderException(kind, message)</text><text class="txt" x="14" y="134">+ TranslationProviderException(kind, message, cause)</text><text class="txt" x="14" y="160">+ kind(): Kind</text></g>
  <g transform="translate(980 850)"><rect class="box enum" width="140" height="218" rx="5"/><text class="st" x="70" y="24" text-anchor="middle">«enum»</text><text class="name" x="70" y="48" text-anchor="middle">Kind</text><line x1="0" y1="60" x2="140" y2="60" stroke="#173f31"/><text class="txt" x="12" y="88">TIMEOUT</text><text class="txt" x="12" y="114">REJECTED</text><text class="txt" x="12" y="140">EMPTY_RESPONSE</text><text class="txt" x="12" y="166">UNAVAILABLE</text><text class="txt" x="12" y="192">CONFIGURATION</text></g>
  <g transform="translate(645 1090)"><path class="note" d="M0 0 H420 V55 H0 Z M390 0 V30 H420"/><text class="notetxt" x="14" y="23">Reads Gemini settings from the process environment.</text><text class="notetxt" x="14" y="43">The private API key is never returned.</text></g>

  <rect class="pkg" x="1185" y="210" width="590" height="950" rx="10"/><text class="pkglabel" x="1205" y="240">security</text>
  <g transform="translate(1215 270)"><rect class="box" width="530" height="232" rx="5"/><rect class="head" width="530" height="42" rx="5"/><text class="name" x="265" y="27" text-anchor="middle">AuthenticationInitializer</text><line x1="0" y1="42" x2="530" y2="42" stroke="#173f31"/><text class="txt" x="14" y="68">~ USERNAME_ENVIRONMENT_VARIABLE: String {static}</text><text class="txt" x="14" y="94">~ PASSWORD_ENVIRONMENT_VARIABLE: String {static}</text><text class="txt" x="14" y="120">~ KEYSTORE_PASSWORD_ENVIRONMENT_VARIABLE: String {static}</text><line x1="0" y1="134" x2="530" y2="134" stroke="#173f31"/><text class="txt" x="14" y="160">+ onStartup(classes, servletContext): void</text><text class="txt" x="14" y="186">~ firstMissingEnvironmentVariable(): String {static}</text></g>
  <g transform="translate(1215 555)"><rect class="box" width="530" height="356" rx="5"/><rect class="head" width="530" height="42" rx="5"/><text class="name" x="265" y="27" text-anchor="middle">BasicAuthenticationModule</text><line x1="0" y1="42" x2="530" y2="42" stroke="#173f31"/><text class="txt" x="14" y="68">~ TRANSLATOR_ROLE: String {static}</text><text class="txt" x="14" y="94">- expectedUsername: String</text><text class="txt" x="14" y="120">- expectedPassword: String</text><text class="txt" x="14" y="146">- callbackHandler: CallbackHandler</text><line x1="0" y1="160" x2="530" y2="160" stroke="#173f31"/><text class="txt" x="14" y="186">+ BasicAuthenticationModule(username, password)</text><text class="txt" x="14" y="212">+ initialize(requestPolicy, responsePolicy, handler, options): void</text><text class="txt" x="14" y="238">+ getSupportedMessageTypes(): Class&lt;?&gt;[]</text><text class="txt" x="14" y="264">+ validateRequest(messageInfo, client, service): AuthStatus</text><text class="txt" x="14" y="290">+ secureResponse(messageInfo, service): AuthStatus</text><text class="txt" x="14" y="316">+ cleanSubject(messageInfo, subject): void</text></g>
