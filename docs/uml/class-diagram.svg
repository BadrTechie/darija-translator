  <g transform="translate(800 92)"><rect class="external" width="190" height="72" rx="5"/><text class="st" x="95" y="23" text-anchor="middle">«Java class»</text><text class="name" x="95" y="50" text-anchor="middle">Exception</text></g>
  <g transform="translate(1160 92)"><rect class="external" width="205" height="72" rx="5"/><text class="st" x="102" y="23" text-anchor="middle">«Jakarta interface»</text><text class="name" x="102" y="50" text-anchor="middle">ServletContainerInitializer</text></g>
  <g transform="translate(1395 92)"><rect class="external" width="175" height="72" rx="5"/><text class="st" x="87" y="23" text-anchor="middle">«Jakarta interface»</text><text class="name" x="87" y="50" text-anchor="middle">ServerAuthModule</text></g>
