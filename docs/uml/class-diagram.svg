<svg xmlns="http://www.w3.org/2000/svg" width="2050" height="1200" viewBox="0 0 2050 1200" role="img" aria-labelledby="title desc">
  <title id="title">Darija Translator Java backend UML class diagram</title>
  <desc id="desc">Audited production Java classes in the API, translation, and security packages, with inheritance, interface implementations, construction, composition, and dependencies.</desc>
  <defs>
    <style>
      .bg{fill:#f8f7f2}.pkg{fill:none;stroke:#587066;stroke-width:2;stroke-dasharray:8 5}.box{fill:#fff;stroke:#173f31;stroke-width:2}.external{fill:#f0f3f2;stroke:#587066;stroke-width:1.8}.head{fill:#dcece5}.enum{fill:#fff8df}.title{font:700 28px system-ui,sans-serif;fill:#173f31}.pkglabel{font:700 19px system-ui,sans-serif;fill:#36594c}.name{font:700 16px system-ui,sans-serif;fill:#173f31}.st{font:italic 12px system-ui,sans-serif;fill:#4a6158}.txt{font:13px ui-monospace,monospace;fill:#1d2d27}.label{font:12px system-ui,sans-serif;fill:#27483c}.line{stroke:#2d5d4b;stroke-width:2;fill:none}.dash{stroke-dasharray:7 5}.note{fill:#fff8df;stroke:#8a6b19;stroke-width:1.5}.notetxt{font:13px system-ui,sans-serif;fill:#493b16}
    </style>
