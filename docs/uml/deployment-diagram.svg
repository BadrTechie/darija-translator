<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">Darija Translator UML deployment diagram</title>
  <desc id="desc">Four authenticated clients connect to Open Liberty, whose Java HTTP client calls Gemini using a backend-only key; tests use a local stub.</desc>
  <defs>
    <style>.bg{fill:#f8f7f2}.node{fill:#fff;stroke:#173f31;stroke-width:2}.group{fill:#eef5f1;stroke:#587066;stroke-width:2;stroke-dasharray:8 5}.artifact{fill:#fff8df;stroke:#8a6b19;stroke-width:2}.component{fill:#e2eef8;stroke:#285b82;stroke-width:2}.cloud{fill:#eee7fa;stroke:#684b8b;stroke-width:2}.title{font:700 24px system-ui,sans-serif;fill:#173f31}.head{font:700 18px system-ui,sans-serif;fill:#173f31}.txt{font:14px system-ui,sans-serif;fill:#21362e}.small{font:13px system-ui,sans-serif;fill:#334c43}.line{stroke:#2d5d4b;stroke-width:2.2;fill:none}.dash{stroke-dasharray:8 5}</style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#2d5d4b"/></marker>
  </defs>
  <rect class="bg" width="1400" height="800"/><text class="title" x="40" y="42">Darija Translator — UML Deployment Diagram</text>

  <rect class="group" x="35" y="85" width="340" height="610" rx="12"/><text class="head" x="55" y="118">«device group» Client devices</text>
  <g transform="translate(75 155)"><rect class="artifact" width="260" height="75" rx="8"/><text class="small" x="130" y="24" text-anchor="middle">«artifact»</text><text class="head" x="130" y="51" text-anchor="middle">Python CLI</text></g>
  <g transform="translate(75 270)"><rect class="artifact" width="260" height="75" rx="8"/><text class="small" x="130" y="24" text-anchor="middle">«artifact»</text><text class="head" x="130" y="51" text-anchor="middle">PHP form</text></g>
  <g transform="translate(75 385)"><rect class="artifact" width="260" height="75" rx="8"/><text class="small" x="130" y="24" text-anchor="middle">«artifact»</text><text class="head" x="130" y="51" text-anchor="middle">Chrome MV3 side panel</text></g>
  <g transform="translate(75 500)"><rect class="artifact" width="260" height="75" rx="8"/><text class="small" x="130" y="24" text-anchor="middle">«artifact»</text><text class="head" x="130" y="51" text-anchor="middle">React Native / Expo</text></g>
  <text class="small" x="205" y="625" text-anchor="middle">All call POST /api/translate</text><text class="small" x="205" y="648" text-anchor="middle">and read JSON “translation”</text>

  <rect class="group" x="455" y="85" width="560" height="610" rx="12"/><text class="head" x="475" y="118">«node» Backend host</text>
  <rect class="node" x="495" y="145" width="480" height="405" rx="10"/><text class="head" x="515" y="178">«execution environment» Open Liberty / Java 17</text>
  <g transform="translate(540 210)"><rect class="component" width="390" height="70" rx="8"/><text class="small" x="195" y="23" text-anchor="middle">«component»</text><text class="head" x="195" y="49" text-anchor="middle">Jakarta Authentication Basic module</text></g>
  <g transform="translate(540 325)"><rect class="component" width="390" height="70" rx="8"/><text class="small" x="195" y="23" text-anchor="middle">«component»</text><text class="head" x="195" y="49" text-anchor="middle">JAX-RS API: /health + /translate</text></g>
  <g transform="translate(540 440)"><rect class="component" width="390" height="70" rx="8"/><text class="small" x="195" y="23" text-anchor="middle">«component»</text><text class="head" x="195" y="49" text-anchor="middle">GeminiTranslationClient / JDK HttpClient</text></g>
  <g transform="translate(560 590)"><rect class="artifact" width="350" height="70" rx="8"/><text class="small" x="175" y="22" text-anchor="middle">«artifact» Process environment</text><text class="txt" x="175" y="46" text-anchor="middle">Basic creds · API key · model · timeout</text></g>

  <path class="cloud" d="M1130 175 C1080 175 1060 225 1090 255 C1045 300 1095 350 1135 330 C1160 380 1240 370 1250 325 C1305 345 1340 290 1305 255 C1335 210 1280 165 1240 190 C1215 145 1150 145 1130 175 Z"/><text class="small" x="1192" y="244" text-anchor="middle">«cloud»</text><text class="head" x="1192" y="271" text-anchor="middle">Google Gemini</text><text class="head" x="1192" y="296" text-anchor="middle">Developer API</text>
  <g transform="translate(1090 510)"><rect class="group" width="260" height="145" rx="10"/><text class="small" x="130" y="28" text-anchor="middle">«node» Test JVM</text><rect class="component" x="25" y="50" width="210" height="70" rx="8"/><text class="head" x="130" y="78" text-anchor="middle">Local Gemini-shaped</text><text class="head" x="130" y="101" text-anchor="middle">HTTP stub</text></g>

  <path class="line" marker-end="url(#arrow)" d="M335 192 C430 192 450 245 540 245"/><path class="line" marker-end="url(#arrow)" d="M335 307 C430 307 450 245 540 245"/><path class="line" marker-end="url(#arrow)" d="M335 422 C430 422 450 245 540 245"/><path class="line" marker-end="url(#arrow)" d="M335 537 C430 537 450 245 540 245"/><text class="small" x="395" y="165">HTTP + Basic auth</text>
  <path class="line" marker-end="url(#arrow)" d="M735 280 L735 325"/><path class="line" marker-end="url(#arrow)" d="M735 395 L735 440"/>
  <path class="line" marker-end="url(#arrow)" d="M930 475 C1030 475 1045 300 1090 280"/><text class="small" x="970" y="420">HTTPS generateContent</text><text class="small" x="970" y="442">x-goog-api-key</text>
  <path class="line" marker-end="url(#arrow)" d="M700 590 L700 510"/><path class="line" marker-end="url(#arrow)" d="M800 590 L800 280"/>
  <path class="line dash" marker-end="url(#arrow)" d="M930 485 C1035 500 1030 580 1090 580"/><text class="small" x="980" y="555">offline tests only</text>
</svg>
