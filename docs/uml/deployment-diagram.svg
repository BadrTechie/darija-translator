<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1120" viewBox="0 0 2200 1120" role="img" aria-labelledby="title desc">
  <title id="title">Darija Translator UML deployment diagram</title>
  <desc id="desc">The audited Python, PHP, Chrome extension, and Expo iPhone clients connect to Open Liberty by HTTP JSON and Basic authentication. Only the backend process holds the Gemini key and calls Gemini over HTTPS.</desc>
  <defs>
    <style>
      .bg{fill:#f8f7f2}.group{fill:#eef5f1;stroke:#587066;stroke-width:2;stroke-dasharray:8 5}.node{fill:#fff;stroke:#173f31;stroke-width:2}.artifact{fill:#fff8df;stroke:#8a6b19;stroke-width:2}.component{fill:#e2eef8;stroke:#285b82;stroke-width:2}.store{fill:#f2eafa;stroke:#684b8b;stroke-width:2}.cloud{fill:#eee7fa;stroke:#684b8b;stroke-width:2}.title{font:700 28px system-ui,sans-serif;fill:#173f31}.head{font:700 17px system-ui,sans-serif;fill:#173f31}.txt{font:14px system-ui,sans-serif;fill:#21362e}.small{font:12px system-ui,sans-serif;fill:#334c43}.line{stroke:#2d5d4b;stroke-width:2.1;fill:none}.dash{stroke-dasharray:8 5}.note{fill:#fff8df;stroke:#8a6b19;stroke-width:1.5}.notetxt{font:13px system-ui,sans-serif;fill:#493b16}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#2d5d4b"/></marker>
  </defs>
  <rect class="bg" width="2200" height="1120"/>
  <text class="title" x="36" y="42">Darija Translator — Deployment Diagram</text>

  <rect class="group" x="25" y="75" width="655" height="1005" rx="12"/><text class="head" x="45" y="107">«device» Windows workstation</text>
  <g transform="translate(55 135)"><rect class="node" width="250" height="145" rx="9"/><text class="small" x="125" y="24" text-anchor="middle">«node» Terminal</text><rect class="artifact" x="25" y="45" width="200" height="75" rx="7"/><text class="small" x="125" y="68" text-anchor="middle">«artifact»</text><text class="head" x="125" y="94" text-anchor="middle">Python CLI</text><text class="small" x="125" y="112" text-anchor="middle">darija_translate.py</text></g>
  <g transform="translate(340 135)"><rect class="node" width="305" height="145" rx="9"/><text class="small" x="152" y="22" text-anchor="middle">«node» PHP development server</text><text class="small" x="152" y="40" text-anchor="middle">php -S 127.0.0.1:8081</text><rect class="artifact" x="45" y="55" width="215" height="70" rx="7"/><text class="small" x="152" y="78" text-anchor="middle">«artifact» PHP web client</text><text class="head" x="152" y="105" text-anchor="middle">index.php</text></g>
  <g transform="translate(385 325)"><rect class="node" width="215" height="70" rx="8"/><text class="small" x="107" y="24" text-anchor="middle">«node»</text><text class="head" x="107" y="49" text-anchor="middle">Web browser</text></g>

  <rect class="node" x="55" y="420" width="590" height="390" rx="10"/><text class="head" x="75" y="451">«execution environment» Chrome 116+ / Manifest V3</text>
  <g transform="translate(85 485)"><rect class="artifact" width="220" height="72" rx="7"/><text class="small" x="110" y="23" text-anchor="middle">«artifact»</text><text class="head" x="110" y="49" text-anchor="middle">Service worker</text></g>
  <g transform="translate(385 485)"><rect class="artifact" width="220" height="72" rx="7"/><text class="small" x="110" y="23" text-anchor="middle">«artifact»</text><text class="head" x="110" y="49" text-anchor="middle">Side panel</text></g>
  <g transform="translate(85 635)"><rect class="store" width="220" height="100" rx="8"/><path class="store" d="M0 15 C0 -2 220 -2 220 15 V85 C220 102 0 102 0 85 Z"/><text class="head" x="110" y="40" text-anchor="middle">chrome.storage.local</text><text class="small" x="110" y="64" text-anchor="middle">backend URL</text><text class="small" x="110" y="82" text-anchor="middle">username</text></g>
  <g transform="translate(385 635)"><rect class="store" width="220" height="100" rx="8"/><path class="store" d="M0 15 C0 -2 220 -2 220 15 V85 C220 102 0 102 0 85 Z"/><text class="head" x="110" y="40" text-anchor="middle">chrome.storage.session</text><text class="small" x="110" y="64" text-anchor="middle">runtime password</text><text class="small" x="110" y="82" text-anchor="middle">pending selection</text></g>

  <rect class="node" x="55" y="845" width="590" height="170" rx="10"/><text class="head" x="75" y="876">«device» Physical iPhone</text><rect class="node" x="90" y="895" width="520" height="92" rx="8"/><text class="small" x="350" y="919" text-anchor="middle">«execution environment» Expo Go SDK 58</text><rect class="artifact" x="145" y="932" width="410" height="42" rx="6"/><text class="head" x="350" y="959" text-anchor="middle">React Native client · password in component state only</text>

  <rect class="group" x="1000" y="75" width="665" height="1005" rx="12"/><text class="head" x="1020" y="107">«node» Backend host</text>
  <rect class="node" x="1035" y="135" width="595" height="705" rx="10"/><text class="head" x="1055" y="168">«execution environment» Open Liberty / Java 17 · HTTP endpoint :9080</text>
  <g transform="translate(1075 210)"><rect class="component" width="515" height="80" rx="8"/><text class="small" x="257" y="24" text-anchor="middle">«component»</text><text class="head" x="257" y="51" text-anchor="middle">Liberty HTTP routing and web security constraint</text></g>
  <g transform="translate(1075 345)"><rect class="component" width="515" height="92" rx="8"/><text class="small" x="257" y="24" text-anchor="middle">«component» Jakarta Authentication</text><text class="head" x="257" y="51" text-anchor="middle">BasicAuthenticationModule</text><text class="small" x="257" y="73" text-anchor="middle">validates protected POST and establishes translator-user</text></g>
  <g transform="translate(1075 490)"><rect class="component" width="515" height="126" rx="8"/><text class="small" x="257" y="24" text-anchor="middle">«component» Jakarta REST API</text><text class="head" x="257" y="51" text-anchor="middle">GET /api/health · public</text><text class="head" x="257" y="78" text-anchor="middle">POST /api/translate · protected</text><text class="small" x="257" y="103" text-anchor="middle">validates text and returns JSON</text></g>
  <g transform="translate(1075 680)"><rect class="component" width="515" height="92" rx="8"/><text class="small" x="257" y="24" text-anchor="middle">«component»</text><text class="head" x="257" y="51" text-anchor="middle">GeminiTranslationClient / JDK HttpClient</text><text class="small" x="257" y="74" text-anchor="middle">builds request and maps provider failures</text></g>

  <g transform="translate(1070 875)"><rect class="artifact" width="525" height="145" rx="8"/><text class="small" x="262" y="24" text-anchor="middle">«artifact» Process environment — backend only</text><text class="txt" x="24" y="53">TRANSLATOR_DEMO_USERNAME / TRANSLATOR_DEMO_PASSWORD</text><text class="txt" x="24" y="78">keystore_password</text><text class="txt" x="24" y="103">GEMINI_API_KEY</text><text class="txt" x="24" y="128">GEMINI_MODEL / API base URL / timeout</text></g>

  <path class="cloud" d="M1930 360 C1875 360 1850 410 1885 448 C1838 497 1890 555 1938 531 C1965 585 2062 575 2075 522 C2135 545 2175 482 2135 442 C2170 390 2108 342 2062 370 C2035 318 1952 320 1930 360 Z"/>
  <text class="small" x="2008" y="424" text-anchor="middle">«cloud»</text><text class="head" x="2008" y="454" text-anchor="middle">Google Gemini</text><text class="head" x="2008" y="480" text-anchor="middle">Developer API</text>
  <g transform="translate(1880 665)"><path class="note" d="M0 0 H285 V95 H0 Z M255 0 V30 H285"/><text class="notetxt" x="16" y="28">Clients submit backend credentials only.</text><text class="notetxt" x="16" y="53">No client receives or stores</text><text class="notetxt" x="16" y="76">GEMINI_API_KEY.</text></g>

  <path class="line" marker-end="url(#arrow)" d="M600 350 H665 V230 H645"/><rect class="bg" x="330" y="292" width="230" height="25"/><text class="small" x="340" y="309">HTTP form GET / POST</text>
  <path class="line" marker-end="url(#arrow)" d="M305 520 H385"/><text class="small" x="315" y="507">opens panel</text>
  <path class="line" marker-end="url(#arrow)" d="M195 557 V635"/><text class="small" x="205" y="604">selection</text>
  <path class="line" marker-end="url(#arrow)" d="M495 557 V635"/><text class="small" x="505" y="602">runtime data</text>
  <path class="line" marker-end="url(#arrow)" d="M385 535 H330 V685 H305"/><text class="small" x="315" y="672">URL + username</text>

  <path class="line" marker-end="url(#arrow)" d="M180 135 V120 H720 V220 H1075"/><rect class="bg" x="730" y="128" width="260" height="44"/><text class="small" x="742" y="146">HTTP/JSON · GET /api/health</text><text class="small" x="742" y="164">or Basic auth · POST /api/translate</text>
  <path class="line" marker-end="url(#arrow)" d="M645 225 H780 V240 H1075"/><rect class="bg" x="800" y="250" width="190" height="25"/><text class="small" x="810" y="267">HTTP/JSON + Basic auth</text>
  <path class="line" marker-end="url(#arrow)" d="M605 520 H900 V260 H1075"/><rect class="bg" x="700" y="535" width="230" height="25"/><text class="small" x="710" y="552">HTTP/JSON + Basic auth</text>
  <path class="line" marker-end="url(#arrow)" d="M645 952 H940 V280 H1075"/><rect class="bg" x="700" y="900" width="185" height="44"/><text class="small" x="710" y="918">LAN HTTP/JSON</text><text class="small" x="710" y="936">+ Basic auth</text>

  <path class="line" marker-end="url(#arrow)" d="M1332 290 V345"/><text class="small" x="1345" y="324">protected POST</text>
  <path class="line dash" marker-end="url(#arrow)" d="M1590 250 H1615 V553 H1590"/><text class="small" x="1623" y="465">public GET</text>
  <path class="line" marker-end="url(#arrow)" d="M1332 437 V490"/><text class="small" x="1345" y="470">valid identity</text>
  <path class="line" marker-end="url(#arrow)" d="M1332 616 V680"/><text class="small" x="1345" y="654">validated text</text>
  <path class="line" marker-end="url(#arrow)" d="M1550 875 H1615 V391 H1590"/><text class="small" x="1675" y="842">backend credentials</text>
  <path class="line" marker-end="url(#arrow)" d="M1460 875 V772"/><text class="small" x="1472" y="850">server-side key + settings</text>
  <path class="line" marker-end="url(#arrow)" d="M1590 726 H1870 V475 H1890"/><rect class="bg" x="1680" y="600" width="175" height="90"/><text class="small" x="1692" y="620">HTTPS/JSON</text><text class="small" x="1692" y="640">POST /v1beta/models/</text><text class="small" x="1692" y="660">{model}:generateContent</text><text class="small" x="1692" y="680">x-goog-api-key</text>
</svg>
